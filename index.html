      const ce=!!f.ce,lv=[...new Set([...CV,...(f.v?[f.v]:[])])].sort((a,b)=>a-b),ls=[...new Set([...CS,...(f.s?[f.s]:[])])].sort((a,b)=>a-b),ed=(k,list)=>list.map(n=>bt('cx',k+':'+n,'✕ '+n,'bad',false)).join(''),
        add=(k,ph)=>`<div class="g" style="grid-template-columns:1fr auto;margin-top:6px"><input type="text" id="n${k}" inputmode="numeric" maxlength="2" placeholder="${ph}"><button class="b ok" data-a="ca" data-v="${k}">Přidat</button></div>`;
      h+=`<div class="row"><h2>Jádra</h2><button class="b${ce?' ok':''}" style="min-height:36px;padding:0 14px" data-a="ce">${ce?'Hotovo':'Upravit'}</button></div><div class="m">jaderník válec</div><div class="g c7">${ce?ed('cv',CV):sel('cv',lv,f.v)}</div>${ce?add('cv','číslo nového jaderníku válce'):''}<div class="m" style="margin-top:6px">jaderník skořepina (pár L+P)</div><div class="g c3">${ce?ed('cs',CS):sel('cs',ls,f.s)}</div>${ce?add('cs','číslo nové skořepiny')+'<div class="m">Změna platí od ${fmt(S.d)} dál. Starší dny i už zapsané kusy zůstanou beze změny.</div>':''}`}
    const tzl=f.newT?'Nová zkouška':f.te?f.te+' ✓':'Zkouška…';
    h+=`<div class="g c2" style="margin-top:8px">${bt('ns',1,'Vada, NENÍ zmetek','wr',f.ns)}${bt('tzp',1,tzl,'te',!!(f.te||f.newT||f.tzp))}</div>`;
    if(f.tzp||f.newT)h+=`<h2>Zkouška</h2><div class="g">${bt('tz','','Není zkouška','',!f.te&&!f.newT)}${S.tests.filter(t=>!t.done||f.te===t.id).map(t=>'<div class="g" style="grid-template-columns:1fr auto">'+bt('tz',t.id,e(t.id+' · '+t.name),'te',f.te===t.id)+(t.done?'<span class="m" style="align-self:center;padding:0 8px">hotová ✓</span>':bt('kv',t.id,'✓ hotová','ok',0))+'</div>').join('')}${bt('tn0',1,'+ Nová zkouška','te',f.newT)}</div>`;
    if(f.newT)h+=`<div class="m" style="margin-top:6px">Označení (zk${S.tc+1}) a datum ${fmt(S.d)} se doplní samo.</div><div style="margin-top:6px"><input type="text" data-f="tnn" value="${e(f.tnn)}" placeholder="název zkoušky (např. odfuk z jader)"></div><div style="margin-top:6px"><textarea data-f="tnt" rows="2" placeholder="popis zkoušky (nepovinné)">${e(f.tnt)}</textarea></div>`;
    if(f.tzp||f.newT)h+=`<div style="margin-top:6px"><textarea data-f="no" rows="3" placeholder="poznámka k tomuto kusu – podrobnosti o zmetku">${e(f.no)}</textarea></div>`}
  const ex=dayD(S.d).r[f.k+'-'+f.p];
  const mi=[];if(!f.nc&&f.z.size){if(!f.t.size&&!f.j.trim())mi.push('typ vady');if(!f.v)mi.push('jaderník válec');if(!f.s)mi.push('skořepina')}
  return h+`${ex&&canDel()?`<button class="sv s2" data-a="dl">${AR==='dl'?'Opravdu smazat? Klepni znovu':'Smazat tento záznam'}</button>`:''}<div class="stk"><div style="display:flex;gap:8px;align-items:center"><div class="mt" style="flex:1"></div><button class="sv" style="width:100%" data-a="sv">${ex?'Přepsat':'Uložit kus'}</button></div></div></main>`}

function stats(dates,ex){const o={odl:0,sc:0,kolo:{},z:{},t:{},v:{},s:{},c:{},zt:{},cd:{}};
  for(const dd of dates){const d=S.days[dd],pl=PL(dd);for(const kk of d.k){const ko=o.kolo[kk.n]=o.kolo[kk.n]||{o:0,s:0};
    for(const p of pl){const r=d.r[kk.n+'-'+p];
      if(r&&(r.nc||(ex&&r.te)))continue;o.odl++;ko.o++;if(!r)continue;
      const sc=!!isScrap(r);
      if(sc){o.sc++;ko.s++;if(!r.t.length||r.j||r.t.some(i=>!nzT(i)))r.z.forEach(z=>o.z[z]=(o.z[z]||0)+1);r.t.forEach(i=>o.t[T[i]]=(o.t[T[i]]||0)+1);if(r.j){const jn='jiné: '+String(r.j).trim().toLowerCase();o.t[jn]=(o.t[jn]||0)+1}const dk=[];r.t.forEach(i=>{if(nzT(i))dk.push(T[i]);else(r.z.length?r.z:['?']).forEach(z=>dk.push(T[i]+' · zóna '+z))});if(r.j)(r.z.length?r.z:['?']).forEach(z=>dk.push('jiné: '+String(r.j).trim().toLowerCase()+' · zóna '+z));if(!dk.length)r.z.forEach(z=>dk.push('bez typu · zóna '+z));dk.forEach(x=>{o.zt[x]=(o.zt[x]||0)+1;if(r.v&&r.s){const ck='V'+r.v+' + S'+r.s;(o.cd[ck]=o.cd[ck]||{})[x]=((o.cd[ck]||{})[x]||0)+1}})}
      const add=(m,k)=>{m[k]=m[k]||{n:0,s:0};m[k].n++;if(sc)m[k].s++};
      if(r.v)add(o.v,'Válec '+r.v);if(r.s)add(o.s,'Skořepina '+r.s);if(r.v&&r.s)add(o.c,'V'+r.v+' + S'+r.s)}}}
  return o}
function tstat(id){let n=0,s=0;const rows=[];for(const d of Object.keys(S.days).sort())for(const r of Object.values(S.days[d].r))if(r.te===id){n++;const bad=!!isScrap(r);if(bad)s++;rows.push([d,r,bad])}
  rows.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:a[1].k-b[1].k||a[1].p-b[1].p);return{n,s,ok:n-s,rows}}
const isEv=r=>!!(r.ev||r.z.length||r.t.length||r.j||r.ns||r.v||r.s||r.nc);
const pc=(a,b)=>b?(100*a/b).toFixed(1)+' %':'–';
function pareto(m){const en=Object.entries(m).sort((a,b)=>b[1]-a[1]),tot=en.reduce((s,x)=>s+x[1],0);
  if(!tot)return'<div class="m">Zatím žádná data.</div>';let c=0;const mx=en[0][1];
  return en.map(([k,v])=>{c+=v;return`<div class="bar"><i style="width:${100*v/mx}%"></i><span>${k}: ${v} ks · podíl ${pc(v,tot)} · kumul. ${pc(c,tot)}</span></div>`}).join('')}
function rate(m,c1){const en=Object.entries(m).sort((a,b)=>b[1].s-a[1].s||String(a[0]).localeCompare(String(b[0]),'cs',{numeric:true}));
  if(!en.length)return'<div class="m">Zatím žádná data.</div>';
  return`<table><tr><th>${c1||''}</th><th>zmetků (ks)</th></tr>`+en.map(([k,v])=>`<tr><td>${e(k)}</td><td><b>${v.s}</b></td></tr>`).join('')+'</table>'}


const PAL=['#2563eb','#dc2626','#f59e0b','#16a34a','#7c3aed','#0891b2','#db2777','#65a30d','#ea580c','#4f46e5','#0d9488','#9ca3af'];
function svgPareto(m){const en=Object.entries(m).sort((a,b)=>b[1]-a[1]),tot=en.reduce((s,x)=>s+x[1],0);if(!tot)return'<div class="m">Zatím žádná data.</div>';
  const W=360,H=240,L=26,R=30,T=16,B=84,pw=W-L-R,ph=H-T-B,mx=en[0][1],bw=pw/en.length;let c=0,pts=[],g='';
  [0,.5,1].forEach(f=>{g+=`<line x1="${L}" x2="${W-R}" y1="${T+ph*(1-f)}" y2="${T+ph*(1-f)}" stroke="currentColor" opacity=".12"/><text x="${W-R+3}" y="${T+ph*(1-f)+3}" font-size="9" fill="#f59e0b">${f*100}%</text>`});
  en.forEach(([k,v],i)=>{c+=v;const x=L+i*bw,h=ph*v/mx;g+=`<rect x="${x+bw*.12}" y="${T+ph-h}" width="${bw*.76}" height="${h}" rx="2" fill="#2563eb"/><text x="${x+bw/2}" y="${T+ph-h-3}" font-size="9" text-anchor="middle" fill="currentColor">${v}</text><text transform="translate(${x+bw/2+3},${T+ph+8}) rotate(-50)" font-size="9" text-anchor="end" fill="currentColor">${e(k)}</text>`;pts.push((x+bw/2).toFixed(1)+','+(T+ph-ph*c/tot).toFixed(1))});
  g+=`<polyline points="${pts.join(' ')}" fill="none" stroke="#f59e0b" stroke-width="2"/>`+pts.map(q=>`<circle cx="${q.split(',')[0]}" cy="${q.split(',')[1]}" r="2.5" fill="#f59e0b"/>`).join('');
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;color:inherit">${g}</svg>`}
function svgPie(m){const en=Object.entries(m).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>0),tot=en.reduce((s,x)=>s+x[1],0);if(!tot)return'';
  let a0=-Math.PI/2,g='';const R=80,cx=90,cy=90;
  en.forEach(([k,v],i)=>{const a1=a0+2*Math.PI*v/tot,col=PAL[Math.min(i,PAL.length-1)];
    if(en.length===1)g+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="${col}"/>`;
    else g+=`<path d="M${cx},${cy} L${(cx+R*Math.cos(a0)).toFixed(2)},${(cy+R*Math.sin(a0)).toFixed(2)} A${R},${R} 0 ${a1-a0>Math.PI?1:0} 1 ${(cx+R*Math.cos(a1)).toFixed(2)},${(cy+R*Math.sin(a1)).toFixed(2)} Z" fill="${col}" stroke="#fff" stroke-width="1"/>`;a0=a1});
  return`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 180 180" style="width:170px;height:170px;flex:none">${g}</svg><div style="font-size:13px;flex:1;min-width:140px">`+en.map(([k,v],i)=>`<div><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${PAL[Math.min(i,PAL.length-1)]};margin-right:6px"></span>${e(k)}: <b>${pc(v,tot)}</b> (${v})</div>`).join('')+'</div></div>'}
function rateChart(m,n,from){const en=Object.entries(m).sort((a,b)=>b[1].s-a[1].s||String(a[0]).localeCompare(String(b[0]),'cs',{numeric:true}));if(!en.length)return'';const mx=Math.max(...en.map(x=>x[1].s))||1;
  return en.slice(from||0,n||999).map(([k,v])=>`<div class="rw"><div class="rt"><span>${e(k)}</span><b>${v.s}</b></div><div class="rb"><i style="width:${Math.max(4,100*v.s/mx)}%"></i></div></div>`).join('')}

const topN=(m,n)=>Object.entries(m||{}).sort((a,b)=>b[1]-a[1]).slice(0,n);
function dayRows(ks,ex){return ks.map(d=>{const q=stats([d],ex);return{d,odl:q.odl,sc:q.sc}})}
function svgTrend(rows){if(rows.length<2)return'';const W=360,H=170,L=34,R=10,T0=14,B=34,pw=W-L-R,ph=H-T0-B,ys=rows.map(r=>r.odl?100*r.sc/r.odl:0),mx=Math.max(5,Math.ceil(Math.max(...ys)/5)*5);
  const X=i=>L+pw*i/(rows.length-1),Y=v=>T0+ph*(1-v/mx);let g=[0,.5,1].map(f=>`<line x1="${L}" x2="${W-R}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="currentColor" opacity=".12"/><text x="${L-4}" y="${Y(mx*f)+3}" font-size="9" text-anchor="end" fill="currentColor">${(mx*f).toFixed(0)}%</text>`).join('');

const XW={};
XW.crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
XW.crc=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=XW.crcT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
XW.zip=files=>{const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  for(const [name,data] of files){const nb=enc.encode(name),db=typeof data==='string'?enc.encode(data):data,crc=XW.crc(db);
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)]);
    parts.push(lh,nb,db);
    cen.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=lh.length+nb.length+db.length}
  const cl=cen.reduce((s,a)=>s+a.length,0),end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cl),...u32(off),...u16(0)]);
  const all=[...parts,...cen,end],out=new Uint8Array(all.reduce((s,a)=>s+a.length,0));let p=0;for(const a of all){out.set(a,p);p+=a.length}return out};
XW.esc=s=>String(s==null?'':s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
XW.col=n=>{let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
XW.q=n=>"'"+String(n).replace(/'/g,"''")+"'";
XW.ref=(sh,c1,r1,c2,r2)=>XW.q(sh)+'!$'+XW.col(c1)+'$'+(r1+1)+(c2==null?'':':$'+XW.col(c2)+'$'+(r2+1));
